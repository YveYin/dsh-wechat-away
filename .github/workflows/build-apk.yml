name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 APK
        run: bash android/build-ci.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wechat-away-apk
          path: android/build/wechat-away.apk
          if-no-files-found: error
          retention-days: 14
