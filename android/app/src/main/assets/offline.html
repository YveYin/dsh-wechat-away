<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>连不上电脑</title>
<style>
  body{margin:0;background:#0F1115;color:#E5E7EB;font:16px/1.7 -apple-system,"PingFang SC",sans-serif;padding:28px}
  h1{font-size:20px;margin:0 0 12px}
  p{color:#9AA4B2;margin:0 0 10px}
  code{background:#1B2028;padding:2px 6px;border-radius:6px;color:#93C5FD}
  button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:#2563EB;color:#fff;font-size:16px}
  button.ghost{background:#1B2028;color:#E5E7EB;margin-top:10px}
</style>
<h1>连不上电脑上的值守服务</h1>
<p>可能原因：电脑没开机 / DSH 没运行 / 不在同一个 Tailscale 网络 / 地址或配对码填错。</p>
<p>当前地址：<code id="u">—</code></p>
<button onclick="AndroidBridge.openSettings()">修改服务器地址</button>
<button class="ghost" onclick="AndroidBridge.reload()">重新加载</button>
<script>
  try { document.getElementById('u').textContent = AndroidBridge.currentUrl() || '（未设置）' } catch (e) {}
</script>
