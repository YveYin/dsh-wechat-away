<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>微信值守</title>
<style>
  :root{
    --bg:#0B0D11; --card:#141922; --line:#222A36;
    --fg:#E8ECF3; --muted:#8D99AB; --brand:#4F7CFF; --brand-dim:#2A3A63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(120% 80% at 50% 0%,#141A26 0%,var(--bg) 60%);
    color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  }
  .mark{
    width:76px;height:76px;border-radius:22px;margin-bottom:22px;
    background:linear-gradient(160deg,#3C63D8,#25408F);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 34px rgba(37,64,143,.45),inset 0 1px 0 rgba(255,255,255,.16);
  }
  .mark svg{width:40px;height:40px;display:block}
  h1{font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:.2px}
  p.desc{margin:0;color:var(--muted);font-size:14px;text-align:center;max-width:300px}
  .card{
    width:100%;max-width:360px;margin-top:26px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
  }
  .card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .card .url{
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#A8C0FF;
    word-break:break-all;
  }
  .hint{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.55}
  .actions{width:100%;max-width:360px;margin-top:22px;display:flex;flex-direction:column;gap:11px}
  button{
    appearance:none;border:0;border-radius:14px;padding:15px 18px;font-size:15.5px;
    font-weight:600;letter-spacing:.2px;width:100%;
    background:linear-gradient(180deg,#5B86FF,#3E6BEF);color:#fff;
    box-shadow:0 8px 22px rgba(62,107,239,.32);
  }
  button:active{transform:translateY(1px);box-shadow:0 4px 14px rgba(62,107,239,.28)}
  button.ghost{
    background:#171D27;color:#C7D1E0;border:1px solid var(--line);box-shadow:none;font-weight:500;
  }
  button.ghost:active{background:#1D2431}
  .foot{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
    font-size:11.5px;color:#4E5A6C;letter-spacing:.4px}
</style>

<div class="mark">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H12l-4.6 3.2c-.5.4-1.4 0-1.4-.7V17H6.5A2.5 2.5 0 0 1 4 14.5v-8Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="9.2" cy="10.2" r="1.15" fill="#fff"/>
    <circle cx="14.8" cy="10.2" r="1.15" fill="#fff"/>
  </svg>
</div>

<h1>还没有连上电脑</h1>
<p class="desc">手机正通过 Tailscale 找你的电脑，通常要十几秒。连上后会自动打开值守面板。</p>

<div class="card">
  <div class="label">当前地址</div>
  <div class="url" id="u">—</div>
  <div class="hint">连不上的常见原因：电脑没开机、DSH 没运行、手机关了 Tailscale、或者电脑换了 IP。</div>
</div>

<div class="actions">
  <button onclick="retry()">重新连接</button>
  <button class="ghost" onclick="AndroidBridge.openSettings()">修改服务器地址</button>
</div>

<div class="foot">微信值守</div>

<script>
  var tries = 0;
  function retry(){
    tries++;
    if (window.AndroidBridge && AndroidBridge.reload){
      // 第 1、2 次直接重载；再不行就让用户确认地址，避免一直空转。
      AndroidBridge.reload();
    }
  }
  try {
    document.getElementById('u').textContent = AndroidBridge.currentUrl() || '（未设置）';
  } catch (e) {}
  // 出错页也自动重试两次，省得用户手动点。
  var auto = 0;
  var timer = setInterval(function(){
    if (++auto > 2) { clearInterval(timer); return; }
    retry();
  }, 5000);
</script>
